<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Defentra - Enterprise Security Operations Center (SOC)</title>
    <!-- Tailwind CSS for modern styling -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen p-6">

    <div class="max-w-7xl mx-auto space-y-6">
        <!-- Header -->
        <header class="flex justify-between items-center border-b border-slate-800 pb-4">
            <div>
                <h1 class="text-3xl font-bold tracking-wider text-red-500">🛡️ DEFENTRA SOC</h1>
                <p class="text-sm text-slate-400">Enterprise SIEM, Threat Intelligence & Active Defense Dashboard</p>
            </div>
            <div id="status-badge" class="px-3 py-1 rounded-full text-xs font-semibold bg-emerald-950 text-emerald-400 border border-emerald-800">
                ● System Live
            </div>
        </header>

        <!-- Quick Stats Grid -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div class="bg-slate-900 border border-slate-800 p-4 rounded-xl">
                <h3 class="text-xs font-semibold text-slate-400 uppercase">Total Logged Events</h3>
                <p id="stat-total" class="text-2xl font-bold text-white mt-1">0</p>
            </div>
            <div class="bg-slate-900 border border-slate-800 p-4 rounded-xl">
                <h3 class="text-xs font-semibold text-slate-400 uppercase">Critical Threats</h3>
                <p id="stat-critical" class="text-2xl font-bold text-red-400 mt-1">0</p>
            </div>
            <div class="bg-slate-900 border border-slate-800 p-4 rounded-xl">
                <h3 class="text-xs font-semibold text-slate-400 uppercase">Active Firewall Bans</h3>
                <p id="stat-bans" class="text-2xl font-bold text-amber-400 mt-1">Active</p>
            </div>
        </div>

        <!-- Main Audit Logs Table -->
        <div class="bg-slate-900 border border-slate-800 rounded-xl overflow-hidden shadow-xl">
            <div class="p-4 border-b border-slate-800 flex justify-between items-center">
                <h2 class="text-lg font-semibold text-slate-200">Live SIEM Audit Trail</h2>
                <button onclick="fetchAuditLogs()" class="px-3 py-1.5 text-xs bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-lg transition">
                    🔄 Refresh Logs
                </button>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse text-sm">
                    <thead>
                        <tr class="bg-slate-950/50 text-slate-400 border-b border-slate-800">
                            <th class="p-3">Timestamp</th>
                            <th class="p-3">Event Type</th>
                            <th class="p-3">Source IP</th>
                            <th class="p-3">Severity</th>
                            <th class="p-3">Description</th>
                        </tr>
                    </thead>
                    <tbody id="logs-table-body" class="divide-y divide-slate-800/60">
                        <tr>
                            <td colspan="5" class="p-4 text-center text-slate-500">Loading audit events...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- JavaScript to Fetch Data from FastAPI Backend -->
    <script>
        const API_BASE = "http://localhost:8000";

        async function fetchAuditLogs() {
            try {
                const response = await fetch(`${API_BASE}/api/siem/audit-logs`);
                const logs = await response.json();
                
                const tbody = document.getElementById("logs-table-body");
                tbody.innerHTML = "";

                let criticalCount = 0;

                if (logs.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="5" class="p-4 text-center text-slate-500">No security events recorded yet.</td></tr>`;
                    return;
                }

                document.getElementById("stat-total").innerText = logs.length;

                logs.forEach(log => {
                    if (log.severity === "Critical" || log.severity === "High") {
                        criticalCount++;
                    }

                    // Severity Badge Styling
                    let severityClass = "bg-slate-800 text-slate-300";
                    if (log.severity === "Critical") severityClass = "bg-red-950 text-red-400 border border-red-800";
                    else if (log.severity === "High") severityClass = "bg-amber-950 text-amber-400 border border-amber-800";
                    else if (log.severity === "Medium") severityClass = "bg-yellow-950 text-yellow-400 border border-yellow-800";
                    else if (log.severity === "Low") severityClass = "bg-emerald-950 text-emerald-400 border border-emerald-800";

                    const row = `
                        <tr class="hover:bg-slate-800/40 transition">
                            <td class="p-3 text-slate-400 font-mono text-xs">${new Date(log.timestamp).toLocaleString()}</td>
                            <td class="p-3 font-semibold text-slate-200">${log.event_type}</td>
                            <td class="p-3 font-mono text-xs text-indigo-400">${log.source_ip}</td>
                            <td class="p-3"><span class="px-2 py-0.5 rounded-full text-xs font-semibold ${severityClass}">${log.severity}</span></td>
                            <td class="p-3 text-slate-300">${log.description}</td>
                        </tr>
                    `;
                    tbody.innerHTML += row;
                });

                document.getElementById("stat-critical").innerText = criticalCount;

            } catch (error) {
                console.error("Failed to fetch SIEM logs:", error);
                document.getElementById("status-badge").className = "px-3 py-1 rounded-full text-xs font-semibold bg-red-950 text-red-400 border border-red-800";
                document.getElementById("status-badge").innerText = "● Backend Disconnected";
            }
        }

        // Auto-refresh logs every 5 seconds
        fetchAuditLogs();
        setInterval(fetchAuditLogs, 5000);
    </script>
</body>
</html>
